name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hunar
          POSTGRES_PASSWORD: hunar
          POSTGRES_DB: hunar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hunar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hunar:hunar@localhost:5432/hunar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run kb:check
      - run: npm run build
